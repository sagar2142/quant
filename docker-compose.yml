# Local infrastructure. MASTER_PLAN §13.7: ports bind to 127.0.0.1 only,
# never 0.0.0.0 — nothing here is ever reachable from outside this machine.

services:
  postgres:
    image: postgres:16-alpine
    container_name: neutron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neutron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neutron}
      POSTGRES_DB: ${POSTGRES_DB:-neutron}
      # Deterministic ordering and UTC storage (§14.1.3)
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      TZ: UTC
      PGTZ: UTC
    # 5433 on the host: 5432 is commonly taken by another project's Postgres.
    # Container-internal port stays 5432.
    ports:
      - "127.0.0.1:${NEUTRON_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neutron} -d ${POSTGRES_DB:-neutron}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - timezone=UTC

  # Only needed from M9 (real-time paper trading). Harmless to run earlier.
  redis:
    image: redis:7-alpine
    container_name: neutron-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEUTRON_REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    profiles: ["realtime"]

volumes:
  pgdata:
  redisdata:
