name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    name: lint · types · boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check --no-fix .

      - name: ruff (format check)
        run: ruff format --check .

      - name: mypy --strict
        run: mypy core data quant engine trading ops

      - name: architecture boundaries (§3.2)
        run: lint-imports

      - name: neutron AST lints (§14.8)
        run: python -m tools.lints

  tests:
    name: tests · coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neutron
          POSTGRES_PASSWORD: neutron
          POSTGRES_DB: neutron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NEUTRON_DB_URL: postgresql+psycopg://neutron:neutron@localhost:5432/neutron_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: unit + integration tests
        run: pytest --cov --cov-report=term-missing

      # §14.5 — 100% required on modules where a wrong number costs money.
      - name: coverage gate on money-touching modules
        run: |
          coverage report --fail-under=100 \
            --include="engine/costs/*,trading/risk/*,trading/portfolio/*,trading/execution/*"

  regression:
    name: backtest golden numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"
      # §M3 gate: pinned backtest outputs. Any drift fails the build.
      - name: regression suite
        run: pytest -m regression -q
