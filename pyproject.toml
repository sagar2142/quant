[project]
name = "neutron"
version = "0.1.0"
description = "Personal multi-market quantitative research and trading system"
requires-python = ">=3.10"

dependencies = [
    # core numerics
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "duckdb>=1.0",
    # statistics / modelling
    "statsmodels>=0.14",
    "arch>=7.0",
    "scikit-learn>=1.5",
    "cvxpy>=1.5",
    # service layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # io
    "httpx>=0.27",
    "websockets>=12.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    # Free corporate-actions source for NSE (unofficial; see data/feeds/yahoo.py)
    "yfinance>=0.2.40",
    # zoneinfo has no tz database on Windows; this supplies it
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "types-requests",
    "pandas-stubs",
]
lab = [
    "streamlit>=1.38",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "plotly>=5.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "data*", "quant*", "engine*", "trading*", "ops*", "apps*", "tools*"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff — lint + format.  Rule selection encodes MASTER_PLAN Part 14.
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes           — unused imports/vars (§14.3)
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear            — B006 mutable default args (§14.3)
    "A",           # builtin shadowing
    "C4",          # comprehensions
    "DTZ",         # flake8-datetimez   — naive datetime ban (§14.1.3)
    "T20",         # T201 print() ban   (§14.3)
    "SIM",         # simplify
    "ARG",         # unused arguments   (§14.3)
    "PTH",         # use pathlib
    "ERA",         # ERA001 commented-out code ban (§14.3)
    "PL",          # pylint: PLR0913 args, PLR0912 branches, PLR0915 statements
    "TRY",         # tryceratops       — bare except / silent swallow (§14.1.5)
    "BLE",         # blind `except Exception` (§14.1.5)
    "RUF",
    "S",           # bandit security   — S110 try-except-pass
    "TD",          # TD003 TODO needs issue link (§14.3)
    "C90",         # mccabe complexity (§14.2)
]
ignore = [
    "E501",    # line length handled by formatter
    "TRY003",  # long messages in exceptions are fine and useful here
    "PLR0911", # multiple returns — guard-clause style is required by §14.2
    "SIM103",  # ditto: collapsing guard clauses into a negated boolean is less
               # readable, and §14.2 mandates early-return over nesting
    "S101",    # assert — used deliberately in tests and invariants
]

[tool.ruff.lint.per-file-ignores]
# Deferred imports in tests guard optional dependencies; C408 dict() kwargs
# make fixture builders readable.
"tests/**"       = ["S", "PLR2004", "ARG", "DTZ", "PLC0415", "C408"]
"apps/lab/**"    = ["T20"]         # streamlit/notebook surface is disposable
"apps/cli/**"    = ["T20"]         # a CLI's output IS its interface
"tools/lints/**" = ["T20"]         # lint CLI prints diagnostics by design
# A strategy's constructor parameters ARE its specification — they are already
# captured verbatim in StrategySpec.parameters and validated in __post_init__.
# Wrapping them in a second config object would duplicate that with no added
# safety. The real hazard, positional confusion, is removed by making every
# tuning parameter keyword-only, which PLR0917 still enforces here.
"quant/strategies/**" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10                 # §14.2

[tool.ruff.lint.pylint]
max-args = 5                        # §14.2
max-branches = 12
max-statements = 50                 # §14.2

[tool.ruff.lint.isort]
known-first-party = ["core", "data", "quant", "engine", "trading", "ops", "apps", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────────────
# mypy — strict on every module that produces a number (§14.6)
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "statsmodels.*", "arch.*", "cvxpy.*", "duckdb.*", "yfinance.*",
    "sklearn.*", "scipy.*", "exchange_calendars.*", "plotly.*", "streamlit.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.lab.*", "tests.*"]
strict = false
disallow_untyped_defs = false

# ─────────────────────────────────────────────────────────────────────────────
# pytest / coverage
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a second",
    "integration: needs postgres or network",
    "regression: golden-number backtest regression (§14.5)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["core", "data", "quant", "engine", "trading"]
omit = ["*/__init__.py", "apps/lab/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    # Protocol method bodies are signatures, not code. They never execute, so
    # counting them as uncovered would force meaningless tests against stubs.
    '^\s*\.\.\.$',
    'class .*\bProtocol\)',
]
