[package]
name = "neutron-console"
version = "0.1.0"
edition = "2021"
description = "Neutron ops console"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
