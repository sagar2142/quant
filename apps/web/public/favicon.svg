<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Neutron mark: a ring cut through its middle — a particle, opened
       along zero. A neutron carries no charge; a market-neutral book carries
       no market. The two arcs are equal, opposite, and separated by exactly
       the line they are measured against, and the figure is unchanged by a
       180° rotation about its centre.

       A closed curve rather than an arrangement of strokes, because this file
       is rendered at sixteen pixels in a tab strip: the eye completes a circle
       from very little, where four separate bars rasterised to a smudge once
       their strokes and gaps both fell under two pixels.

       Round terminals, so the cut reads as a deliberate slot with finished
       ends rather than a shape that was masked off.

       The dark plate is drawn in rather than left transparent, so the mark
       keeps its contrast on light browser chrome as well as dark. -->
  <rect width="32" height="32" rx="7" fill="#0b0d10"/>
  <g stroke="#4a9eff" stroke-width="5.4" stroke-linecap="round" fill="none">
    <path d="M 7.16 14.3 A 9 9 0 1 1 24.84 14.3"/>
    <path d="M 7.16 17.7 A 9 9 0 1 0 24.84 17.7"/>
  </g>
</svg>
